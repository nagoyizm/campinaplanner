  - '@whiskeysockets/baileys'
  - 'protobufjs'

overrides:
  uuid: ^14.0.1
  postcss: ^8.5.24
  protobufjs: ^7.4.0
  brace-expansion: ^5.0.8
  sharp: ^0.35.0
