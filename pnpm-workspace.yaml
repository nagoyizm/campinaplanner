packages:
  - '.'
  - 'mobile'
  - 'whatsapp-bot'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@whiskeysockets/baileys': true
  core-js: true
  prisma: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - 'postcss@8.5.24'
  - 'brace-expansion@5.0.9'

overrides:
  uuid: ^14.0.1
  postcss: ^8.5.24
  protobufjs: ^7.4.0
  brace-expansion: ^5.0.9
  sharp: ^0.35.0
  nanoid: ^3.3.17
  dompurify: ^3.4.13
  js-yaml: ^4.3.1
